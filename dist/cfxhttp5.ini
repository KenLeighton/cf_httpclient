; cfxhttp5.ini - defaults for the cfx_http5 Java CFX tag (unicom-cfx.jar). Same format as the CFX_HTTP5 DLL's ini,
; so an existing cfxhttp5.ini can be used as it is.
; The tag reads the cfxhttp5.ini in the folder its unicom-cfx.jar was loaded from (or the file named by the JVM option
; -Dunicom.cfxhttp5.ini=<path>). It is re-read when the file changes - no restart needed. Without a file, the tag uses
; the values below. nThreads (the DLL's limit on simultaneous requests) is not applied yet - see docs/PARITY.md.

[SERVER]
; Default connection mode: Y = Keep-Alive, N = Close (Connection: close; the connection is not reused)
Keep-Alive=Y
; Default URL handling: Y = decode, E = escape, N = leave as is
URLDecode=N

[HEADERS]
; Default headers sent with every request ("Name: value"; a request's own HEADERS attribute overrides them).
; Header1, Header2, ... are read in order; the list ends at the first missing number.
Header1=Accept: image/gif, image/x-xbitmap, image/jpeg, image/pjpeg, application/vnd.ms-excel, application/msword, application/vnd.ms-powerpoint, */*
Header2=Accept-Language: en-us
Header3=Content-Type: application/x-www-form-urlencoded
Header4=User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36
Header5=Pragma: no-cache
Header6=Cache-Control: no-cache
Header7=Accept-Encoding: gzip
